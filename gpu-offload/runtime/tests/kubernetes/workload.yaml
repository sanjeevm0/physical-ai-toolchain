apiVersion: v1
kind: ServiceAccount
metadata:
  name: remoter-scaling-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remoter-scaling-test
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remoter-scaling-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: remoter-scaling-test
subjects:
  - kind: ServiceAccount
    name: remoter-scaling-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remoter-scaling-test
data:
  remote.yaml: |
    serverstages:
      - name: workers
        perclient: false
        serverimage: localhost/remoter-k8s-scaling-test:local
        serverreplicas: 1
    remoteclasses:
      - "server_identity/MultiInstanceServerIdentity":
          instantiateon:
            - workers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remoter-scaling-client
  labels:
    app: remoter-scaling-client
    xavier: "true"
  annotations:
    xavierconfig: |
      remoteablecm: remoter-scaling-test
      remoteableconts:
        - client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remoter-scaling-client
  template:
    metadata:
      labels:
        app: remoter-scaling-client
        xavier: "true"
    spec:
      serviceAccountName: remoter-scaling-test
      containers:
        - name: client
          image: localhost/remoter-k8s-scaling-test:local
          imagePullPolicy: Never
          env:
            - name: REMOTERPORT
              value: "9000"
            - name: PRINTLOGLEVEL
              value: "warning"
